        function drawPokemons() {
            const drawnPokemons = getRandomPokemons(6);
            showPokemons(drawnPokemons);
        }

        function getRandomPokemons(count) {
            // Implement random draw logic with filters
            let eligiblePokemons = pokemonData;
            if (!filters.allowLegendaries) {
                eligiblePokemons = eligiblePokemons.filter(p => !p.isLegendary);
            }
            if (filters.excludeMegas) {
                eligiblePokemons = eligiblePokemons.filter(p => !p.isMega);
            }
            const shuffled = eligiblePokemons.sort(() => 0.5 - Math.random());
            return shuffled.slice(0, count);
        }

        function showPokemons(pokemons) {
            const container = document.getElementById('pokemon-container');
            container.innerHTML = '';
            pokemons.forEach(p => {
                const pokemonDiv = document.createElement('div');
                pokemonDiv.className = 'pokemon';
                pokemonDiv.innerHTML = `<h2>${p.name}</h2>\n                    <button onclick="pickStat('${p.id}')">Pick Stat</button>\n                    <div class='stats'>\n                        <span class='stat-value' id='stat-${p.id}'></span>\n                    </div>`;
                container.appendChild(pokemonDiv);
            });
            container.querySelectorAll('.pokemon').forEach(p => p.style.display = 'block');
        }

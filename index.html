<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokémon Stat Picker Game</title>
    <style>
        body { font-family: Arial, sans-serif; }
        .hidden { display: none; }
        #total-score { margin-top: 20px; font-weight: bold; }
    </style>
</head>
<body>
    <h1>Pokémon Stat Picker Game</h1>
    <button id="start-game">Start Game</button>
    <div id="game-area" class="hidden">
        <h2>Select Your Pokémon Stats</h2>
        <div id="stats-container"></div>
        <button id="submit-picks">See Total Score</button>
        <p id="total-score" class="hidden"></p>
    </div>
    <script>
        const stats = ["Attack", "Defense", "Speed", "Special Attack", "Special Defense", "HP"];
        let selectedStats = [];
        let totalScore = 0;

        document.getElementById('start-game').addEventListener('click', function() {
            this.classList.add('hidden');
            document.getElementById('game-area').classList.remove('hidden');
            generateStats();
        });

        function generateStats() {
            const container = document.getElementById('stats-container');
            container.innerHTML = '';
            stats.forEach((stat, index) => {
                const statDiv = document.createElement('div');
                statDiv.innerText = stat;
                const button = document.createElement('button');
                button.innerText = 'Pick '
                button.addEventListener('click', () => pickStat(stat, button));
                statDiv.appendChild(button);
                container.appendChild(statDiv);
            });
        }

        function pickStat(stat, button) {
            if (selectedStats.length < 6 && !selectedStats.includes(stat)) {
                selectedStats.push(stat);
                totalScore += Math.floor(Math.random() * 100); // Example score logic
                button.disabled = true;
                button.innerText = 'Locked';
                if (selectedStats.length === 6) {
                    document.getElementById('submit-picks').classList.remove('hidden');
                }
            }
        }

        document.getElementById('submit-picks').addEventListener('click', function() {
            document.getElementById('total-score').innerText = `Total Score: ${totalScore}`;
            document.getElementById('total-score').classList.remove('hidden');
        });
    </script>
</body>
</html>
